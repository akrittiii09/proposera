services:
  - type: web
    name: proposera
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_PATH
        value: "/app/data/proposera.sqlite"
      - key: MEDIA_STORAGE_PATH
        value: "/app/data/media"
    disk:
      name: proposera-data
      mountPath: /app/data
      sizeGB: 1
